# Airflow for the DispatchLedger pipeline.
#
# Deliberately minimal: one scheduler, one api-server, LocalExecutor, and a
# metadata database of its own. The production reference compose file runs
# Celery, Redis, a triggerer and flower, which is a lot of moving parts to
# demonstrate a four-task DAG.
#
# Airflow's metadata database is separate from the application's on purpose.
# Sharing one would couple the pipeline's uptime to the product's, and a
# scheduler under load would compete with customer traffic.

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-only-change-me}
        # Airflow 3 tasks report state back through the Task Execution API. The
    # default points at localhost, which inside the scheduler container is
    # not the api-server -- so tasks start, fail to call home, and die before
    # writing any log.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Components sign and verify those calls with a shared secret; they must
    # all use the same one.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-dev-only-change-me}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Where the DAG's BashOperator finds dbt and the project.
    DBT_PROJECT_DIR: /opt/airflow/analytics
    DBT_BIN: /opt/dbt_venv/bin/dbt
    DBT_PROFILES_DIR: /opt/airflow/analytics
    # Read by the loader task and by dbt's prod target.
    ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL}
    DBT_HOST: host.docker.internal
    DBT_PORT: "5433"
    DBT_USER: dispatch_analytics
    DBT_PASSWORD: dispatch_analytics
    DBT_DBNAME: dispatchledger
    EIA_API_KEY: ${EIA_API_KEY:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    # The dbt project is mounted rather than copied, so editing a model does
    # not mean rebuilding the image.
    - ../analytics:/opt/airflow/analytics
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    # Lets the containers reach dispatch-db, which runs outside this compose
    # project, without putting them on the same network.
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # 8081 because 8080 is already taken by the other Airflow containers
      # on this machine.
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
  # Airflow 3 parses DAG files in a separate process from the scheduler.
  # Without this service, DAGs are never picked up and the UI shows none.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Only needed for deferrable operators, which this DAG does not use, but
  # its absence shows as an unhealthy component in the UI.
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db-data:
