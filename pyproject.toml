[project]
name = "dispatchledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "faker>=40.39.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
dispatchledger = "dispatchledger:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-postgres>=1.11.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
