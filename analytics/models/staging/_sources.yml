version: 2

sources:
  - name: app
    description: >
      The operational tables the API writes to. Read-only from here: the
      analytics layer never writes back into the application's schema.
    database: dispatchledger
    schema: public
    tables:
      - name: tenants
      - name: users
      - name: customers
      - name: delivery_sites
      - name: products
      - name: orders
      - name: deliveries
      - name: invoices
        # If no invoice has been written in two days, either trading has
        # stopped or the pipeline upstream of here is broken. Both are worth
        # a warning.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 2, period: day}
          error_after: {count: 7, period: day}

  - name: external
    description: Reference data loaded by the Airflow pipeline, not by the app.
    database: dispatchledger
    schema: public
    tables:
      - name: raw_fuel_prices
        description: Weekly US No 2 diesel retail price from the EIA open data API.
        loaded_at_field: loaded_at
        freshness:
          # The series is weekly, so ten days without a load means the
          # pipeline has stopped rather than the market being quiet.
          warn_after: {count: 10, period: day}
          error_after: {count: 21, period: day}
