# The service definition, in the repository rather than clicked into a web
# form -- for the same reason every schema change is an Alembic migration:
# infrastructure that exists only in someone's browser session cannot be
# reviewed, cannot be reverted, and cannot be rebuilt when it disappears.
#
# Render reads this on first deploy ("Blueprint"). Values marked sync: false
# are set once in the dashboard and never committed.

services:
  - type: web
    name: dispatchledger
    runtime: docker
    plan: free
    region: oregon

    # Hits /health, which runs SELECT 1 against both connections. A check that
    # only proved the process was alive would keep a database-less instance in
    # service, reporting perfect health while failing every request.
    healthCheckPath: /health

    envVars:
      # Generated by Render and never seen by anyone, including me. The
      # application refuses to start without it, which is the point: a default
      # that works is more dangerous than one that does not.
      - key: JWT_SECRET
        generateValue: true

      # The owner role: the migrations that run at container start, and the
      # login endpoint, which must find a tenant before any tenant is known.
      #
      # Use Neon's DIRECT endpoint here -- the host without "-pooler".
      # Migrations do session-level DDL (CREATE ROLE, ALTER DEFAULT
      # PRIVILEGES), and a transaction-mode pooler can drop that state between
      # statements, leaving a migration half applied. Login is low volume, so
      # it loses nothing by sharing the direct connection.
      - key: DATABASE_URL
        sync: false

      # dispatch_app: not a superuser, owns nothing, row-level security
      # applies to it. Every request goes through this one.
      #
      # Use Neon's POOLED endpoint here -- the host containing "-pooler".
      # This is the high-volume path, many short requests, which is what a
      # pooler is for. It is safe precisely because tenant scoping uses
      # SET LOCAL: the setting is bound to the transaction and cannot survive
      # on a pooled connection into the next request. A session-level SET
      # would leak one tenant's scope into another's request here, which is
      # the bug this project exists to make impossible.
      - key: APP_DATABASE_URL
        sync: false

      # Optional. Without it the Insights page says the warehouse holds no
      # benchmarked deliveries, and nothing else changes.
      - key: EIA_API_KEY
        sync: false

      - key: ANALYTICS_MARTS_SCHEMA
        value: analytics_marts
